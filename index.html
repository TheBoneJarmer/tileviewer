<!DOCTYPE html>

<head>
    <title>Tileviewer</title>
    <meta charset="utf-8" />
    <meta name="author" content="Ruben Labruyere" />
    <meta name="description" content="A very basic tileviewer" />
    <meta name="keywords" content="tile,viewer,aquanore" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" type="text/css" href="css/vars.css" />
    <link rel="stylesheet" type="text/css" href="css/common.css" />
    <link rel="stylesheet" type="text/css" href="css/forms.css" />
</head>

<body>
    <div class="container">
        <div class="nav">
            <span class="link" onclick="togglePanel('load')">
                <i data-lucide="folder-open"></i>
            </span>

            <span class="link" onclick="togglePanel('settings')">
                <i data-lucide="settings"></i>
            </span>
        </div>

        <div class="panel" id="load">
            <button id="btn-load-disk">Load from disk</button>
        </div>

        <div class="panel" id="settings">
            <div class="row">
                <label>Scale:</label>
                <input type="number" min="1" max="10" id="input-scale" value="1" />
            </div>

            <div class="row">
                <label>Frame Width:</label>
                <input type="number" min="1" max="9999" id="input-frame-width" value="16" />
            </div>

            <div class="row">
                <label>Frame Height:</label>
                <input type="number" min="1" max="9999" id="input-frame-height" value="16" />
            </div>
        </div>

        <div class="game">
            <canvas></canvas>
        </div>

        <div class="info">
            <h3>Properties</h3>

            <div class="row">
                <div class="col">
                    <b>Width:</b>
                </div>
                <div class="col">
                    <span class="label" id="label-width">0px</span>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <b>Height:</b>
                </div>
                <div class="col">
                    <span class="label" id="label-height">0px</span>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <b>Frames Hor:</b>
                </div>
                <div class="col">
                    <span class="label" id="label-frames-hor">0</span>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <b>Frames Vert:</b>
                </div>
                <div class="col">
                    <span class="label" id="label-frames-vert">0</span>
                </div>
            </div>

            <h3>Selection</h3>

            <div class="row">
                <div class="col">
                    <b>Hor:</b>
                </div>
                <div class="col">
                    <span class="label" id="label-tile-x">0</span>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <b>Vert:</b>
                </div>
                <div class="col">
                    <span class="label" id="label-tile-y">0</span>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <b>Index:</b>
                </div>
                <div class="col">
                    <span class="label" id="label-tile-index">0</span>
                </div>
            </div>
        </div>
    </div>

    <script src="./src/app.ts" type="module"></script>
    <script src="./src/lucide.js" type="module"></script>
    <script src="./src/ui.js"></script>
</body>
</head>
